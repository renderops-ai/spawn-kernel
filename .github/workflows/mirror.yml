name: Mirror release to Blob

# Copies an already published release to Azure Blob (kernel-release/<release>/).
# New releases are mirrored by "Build kernel" automatically; use this for
# releases published before mirroring existed, or to retry a failed mirror.

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release name, e.g. vmlinux-6.1.182-renderops.2
        required: true

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-24.04
    env:
      RELEASE: ${{ inputs.release }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download release
        run: |
          [[ "$RELEASE" =~ ^vmlinux-[A-Za-z0-9._-]+$ ]] || { echo "bad release name: $RELEASE"; exit 1; }
          mkdir -p dist
          gh release download "$RELEASE" --dir dist \
            --pattern "$RELEASE" --pattern "$RELEASE.config" --pattern SHA256SUMS
          mv "dist/$RELEASE" dist/vmlinux
          mv "dist/$RELEASE.config" dist/config

      - name: Mirror to Blob
        env:
          BLOB_STORAGE_ACCOUNT: ${{ secrets.BLOB_STORAGE_ACCOUNT }}
          BLOB_SECRET_KEY: ${{ secrets.BLOB_SECRET_KEY }}
          BLOB_CONTAINER_NAME: ${{ secrets.BLOB_CONTAINER_NAME }}
        run: scripts/mirror-to-blob.sh "$RELEASE" dist
